feature:
  id: FEAT-002
  name: 解説HTMLの生成と失敗復旧
  planning_status: implementation_ready
requirements:
  - id: REQ-001
    obligation: 管理者が自然言語のtopicと任意の表現指示で初回生成を依頼できる。
  - id: REQ-002
    obligation: 有効な初回生成にはtopicを含める。
  - id: REQ-003
    obligation: 初回生成では表現方法・重点などのinstructionsを任意で含められる。
  - id: REQ-004
    obligation: 初期リリースの生成にはCodex app-serverを使う。
  - id: REQ-005
    obligation: 結果を候補化する前にHTML形式を機械的に検証する。
  - id: REQ-006
    obligation: 形式合格候補の隔離表示確認はFEAT-005との共同受入れ条件として追跡する。
  - id: REQ-007
    obligation: 合格済み版だけを修正元に、新しい候補を生成できる。
  - id: REQ-008
    obligation: 修正生成にも初回と同じHTML検証を行う。
  - id: REQ-009
    obligation: 取得失敗とHTML検証失敗を同じ失敗フローで扱う。
  - id: REQ-010
    obligation: 初回に加え最大3回の再生成で停止する。
  - id: REQ-011
    obligation: 全試行失敗後に最終エラーを表示して停止する。
  - id: REQ-012
    obligation: 自動処理終了後に新しい生成処理を開始できる。
  - id: REQ-013
    obligation: 各生成試行の結果を記録する。
  - id: REQ-014
    obligation: 次の対応を判断できる安全な失敗要約を表示する。
  - id: REQ-026
    obligation: 事前登録済みGoogleメールアドレスの管理者だけに操作を限定する。
  - id: REQ-027
    obligation: 管理者以外による生成・管理操作を拒否する。
business_rules:
  - id: BR-002
    obligation: 対象外トピックをアプリ独自に分類せず、生成基盤の制約は通常の生成失敗として扱う。
  - id: BR-003
    obligation: HTML形式に合格した出力だけを候補として保存する。
  - id: BR-004
    obligation: HTML検証不合格出力を候補、タグ、掲載場所、公開の対象にしない。
  - id: BR-005
    obligation: 自動再生成は初回に加えて最大3回で終了する。
  - id: BR-016
    obligation: 失敗要約に内部ログ、資格情報、秘密値、内部データを含めない。
logical_areas:
  - POST/GETが再利用する生成要求のmigration・永続化基盤
  - generation operationが再利用するCodex app-server外部境界
  - POST operationに必要な生成制御、管理mutation、画面送信、検証
  - GET operationに必要な要求記録読取り、管理read、結果再表示、検証
tasks:
  - id: TASK-002-01
    purpose: 生成要求、試行履歴、形式合格済みHTML候補のmigration・永続化・transaction・read-only取得の共通基盤を提供する。
    acceptance_criteria_reference: features/FEAT-002/tasks.md#task-002-01-生成要求のmigration永続化基盤を実装検証する
    depends_on:
      - FEAT-001 implementation completion
  - id: TASK-002-02
    purpose: 一試行ごとのCodex app-server子processとJSON-RPC境界を安全に管理する共通adapter基盤を提供する。
    acceptance_criteria_reference: features/FEAT-002/tasks.md#task-002-02-codex-app-server-adapter基盤を実装検証する
    depends_on:
      - FEAT-001 Server configuration and composition foundation
  - id: TASK-002-03
    purpose: POST /admin/generation-requestsを、入力から生成制御、HTML検証、HTTP応答、画面送信、operation固有検証までend-to-endで提供する。
    acceptance_criteria_reference: features/FEAT-002/tasks.md#task-002-03-post-admingeneration-requests-をend-to-endで実装検証する
    depends_on:
      - TASK-002-01
      - TASK-002-02
      - FEAT-001 management mutation guard
  - id: TASK-002-04
    purpose: GET /admin/generation-requests/{id}を、入力からread-only取得、HTTP応答、結果再表示、operation固有検証までend-to-endで提供する。
    acceptance_criteria_reference: features/FEAT-002/tasks.md#task-002-04-get-admingeneration-requestsid-をend-to-endで実装検証する
    depends_on:
      - TASK-002-01
      - TASK-002-03
      - FEAT-001 management read guard
acceptance_criteria:
  source: tasks.mdの各Task受け入れ基準およびdesign/test-strategy.md
  feature_complete:
    - 管理者が初回または合格済み版を修正元とする生成を開始でき、HTML形式合格済みの最初の結果だけが不変候補として保存される。
    - 取得不能とHTML形式不合格を同じフローで最大4試行まで記録し、成功時に停止し、全失敗時は候補を作らず安全な要約で終了する。
    - POST/GETの同一origin管理API、PostgreSQL状態・transaction、Codex app-server外部境界、管理画面が承認済みcontractに一致し、候補HTML・秘密・外部詳細を露出しない。
    - DB書込み障害、HTTP切断、shutdown、認証・Origin・CSRF障害に安全に収束し、管理者は失敗後に新規要求を開始できる。
    - unit、実PostgreSQL integration、adapter contract、HTTP、UI、E2Eで設計された受入れ条件を検証する。
constraints:
  - Go Server、React管理画面、PostgreSQL、Codex app-serverを、承認済みのcmd・handler・usecase・repository・domain境界に従って使用する。
  - "Codex app-serverはServer側のrepository adapterだけが利用し、各attemptは固定argv `app-server --stdio`、専用空workdir、`approvalPolicy: never`、`sandbox: read-only`で独立processとして起動する。"
  - 実行可能ファイルとworkdirはServer限定設定として起動時fail-fast検証し、資格情報は専用service accountのapp-server実行環境だけが扱う。
  - 外部I/O中にDB transactionを保持せず、T1〜T4のtransaction・rollback規則、最大4試行、候補不変性を守る。
  - FEAT-001の管理read/mutation guard、同一origin、JSON、`Cache-Control: no-store`、安全な共通error envelopeを再利用する。
  - 候補HTML、未検証出力、prompt、CSRF/session値、Codex内部ID・詳細error、資格情報をBrowser、URL、DOM、DB試行記録、安全ログ、fixtureへ出さない。
  - 正常generationに完了deadlineを置かず、HTTP切断後もServer所有contextで継続し、shutdownでは新規attemptを停止して子processをreapする。
approved_decisions:
  - id: DEC-ARCH-001
    status: approved
  - id: DEC-ARCH-002
    status: approved
  - id: DEC-ARCH-003
    status: approved
  - id: DEC-FEAT-001
    status: approved
  - id: DEC-FEAT-002
    status: approved
