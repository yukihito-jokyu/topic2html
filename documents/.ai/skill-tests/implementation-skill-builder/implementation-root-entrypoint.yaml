scenario: Planning成果物が`documents/`にあり、実装対象の親リポジトリへ実装Skillを生成する。
input_summary: 親リポジトリに生成した`impl-*` Skillはあるが、親Rootの`AGENTS.md`とPlanning workflowへ到達するorchestration entrypointがない。
