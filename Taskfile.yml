version: '3'

tasks:
  frontend:install:
    desc: 固定済みの管理画面依存関係を取得する
    dir: frontend
    cmds:
      - npm ci

  frontend:typecheck:
    desc: 管理画面のTypeScript型整合性を確認する
    dir: frontend
    cmds:
      - npm run typecheck

  frontend:check:
    desc: 管理画面のBiome静的解析・整形検査を実行する
    dir: frontend
    cmds:
      - npm run check

  frontend:lint:
    desc: 管理画面のBiome静的解析を実行する
    dir: frontend
    cmds:
      - npm run lint

  frontend:format:
    desc: 管理画面をBiomeで整形する
    dir: frontend
    cmds:
      - npm run format

  frontend:format:check:
    desc: 管理画面がBiomeで整形済みか確認する
    dir: frontend
    cmds:
      - npm run format:check

  frontend:build:
    desc: 管理画面をBrowser配布用の静的成果物へ変換する
    dir: frontend
    cmds:
      - npm run build

  frontend:test:
    desc: 管理画面のVitestテストを実行する
    dir: frontend
    cmds:
      - npm run test

  frontend:dev:
    desc: 管理画面だけを開発用Serverで起動する
    dir: frontend
    cmds:
      - npm run dev

  backend:dev:
    desc: Server側だけを開発用Serverで起動する
    dir: backend
    cmds:
      - go run ./cmd/topic2html

  frontend:storybook:
    desc: UI部品のStorybookカタログを起動する
    dir: frontend
    cmds:
      - npm run storybook

  frontend:storybook:build:
    desc: UI部品のStorybookカタログをBuildする
    dir: frontend
    cmds:
      - npm run build-storybook

  frontend:storybook:test:
    desc: Storybookの表示・操作・アクセシビリティ検査を実行する
    dir: frontend
    cmds:
      - npm run test-storybook

  frontend:e2e:
    desc: PlaywrightでBrowser上の最小管理画面を検証する
    dir: frontend
    cmds:
      - npm run test:e2e

  backend:verify:
    desc: Server側Goモジュールの取得物が定義と矛盾しないことを確認する
    dir: backend
    cmds:
      - go mod download
      - go mod verify

  backend:format:
    desc: Server側Goファイルをgofmtで整形する
    dir: backend
    cmds:
      - gofmt -w ./cmd ./internal

  backend:format:check:
    desc: Server側Goファイルがgofmt済みか確認する
    dir: backend
    cmds:
      - |
        files="$(gofmt -l ./cmd ./internal)"
        if [ -n "$files" ]; then
          echo "$files"
          exit 1
        fi

  backend:lint:
    desc: Server側Goコードをgolangci-lintで静的解析する
    dir: backend
    cmds:
      - golangci-lint run

  backend:build:
    desc: Serverコードを実行ファイルへ変換できることを確認する
    dir: backend
    cmds:
      - go build -o /dev/null ./cmd/topic2html

  backend:test:
    desc: Server側のGoテストを実行する
    dir: backend
    cmds:
      - go test ./...

  run:
    desc: 外部公開しない最小Serverを127.0.0.1:8080で起動する
    dir: backend
    cmds:
      - go run ./cmd/topic2html

  dev:
    desc: Browser側とServer側の開発用Serverを並行して起動する
    deps:
      - frontend:dev
      - backend:dev

  verify:
    desc: Browser側とServer側の型・Build・Test・依存整合性を順に確認する
    cmds:
      - task: frontend:typecheck
      - task: frontend:check
      - task: frontend:build
      - task: frontend:test
      - task: frontend:storybook:build
      - task: frontend:storybook:test
      - task: frontend:e2e
      - task: backend:verify
      - task: backend:format:check
      - task: backend:lint
      - task: backend:build
      - task: backend:test
