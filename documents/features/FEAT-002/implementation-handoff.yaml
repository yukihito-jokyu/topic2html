  - 候補または版の別origin隔離表示、隔離表示の結合E2E（FEAT-005）
  - タグ・掲載場所の管理（FEAT-004）
  - Codex app-serverの認証方式、配備先、隔離originの具体Hostの選定
  - 承認済み責務境界を満たす内部file path、symbol、framework API、library固有実装、局所コード構造
