version: "3"

vars:
  DB_IMAGE: topic2html-postgres:local
  DB_CONTAINER: topic2html-postgres
  DB_VOLUME: topic2html-postgres-data
  DB_URL: postgres://topic2html:topic2html@127.0.0.1:5432/topic2html?sslmode=disable

tasks:
  frontend:install:
    dir: frontend
    cmds:
      - npm ci

  frontend:verify:
    dir: frontend
    cmds:
      - npm run format:check
      - npm run lint
      - npm run build
      - npm run css:check
      - npm run storybook:build
      - npm run test:e2e
      - npm test

  frontend:storybook:
    dir: frontend
    cmds:
      - npm run storybook

  backend:verify:
    deps: [backend:coverage, backend:lint]
    env:
      GOCACHE: "{{.TASKFILE_DIR}}/.cache/topic2html-gocache"
      GOLANGCI_LINT_CACHE: "{{.TASKFILE_DIR}}/.cache/topic2html-golangci-lint"
    cmds:
      - cd backend && go mod download
      - cd backend && go mod verify
      - cd backend && go test ./...
      - cd backend && go build -o /tmp/topic2html-server ./cmd/server

  backend:lint:
    env:
      GOCACHE: "{{.TASKFILE_DIR}}/.cache/topic2html-gocache"
      GOLANGCI_LINT_CACHE: "{{.TASKFILE_DIR}}/.cache/topic2html-golangci-lint"
    cmds:
      - cd backend && test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - test "$(golangci-lint version --short)" = "2.12.2"
      - cd backend && golangci-lint run ./...

  backend:coverage:
    env:
      GOCACHE: "{{.TASKFILE_DIR}}/.cache/topic2html-gocache"
      GOLANGCI_LINT_CACHE: "{{.TASKFILE_DIR}}/.cache/topic2html-golangci-lint"
    cmds:
      - cd backend && bash ../scripts/check-backend-coverage.sh

  backend:migrate:
    cmds:
      - cd backend && go run ./cmd/migrate

  db:create:
    env:
      DB_IMAGE: "{{.DB_IMAGE}}"
      DB_CONTAINER: "{{.DB_CONTAINER}}"
      DB_VOLUME: "{{.DB_VOLUME}}"
    cmds:
      - bash scripts/create-dev-postgres.sh

  db:delete:
    cmds:
      - docker rm --force {{.DB_CONTAINER}} >/dev/null 2>&1 || true
      - docker volume rm {{.DB_VOLUME}} >/dev/null 2>&1 || true

  db:migrate:
    deps: [db:create]
    env:
      TOPIC2HTML_DATABASE_URL: "{{.DB_URL}}"
    cmds:
      - task backend:migrate

  backend:integration:
    cmds:
      - cd backend && bash ../scripts/run-postgres-integration.sh

  verify:
    deps: [frontend:verify, backend:verify]

  run:
    dir: backend
    cmds:
      - go run ./cmd/server
